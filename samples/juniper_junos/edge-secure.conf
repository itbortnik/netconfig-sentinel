system {
    host-name juniper-edge-01;
    services {
        ssh;
    }
    authentication-order [ radius password ];
    ntp {
        server 192.0.2.10;
    }
    syslog {
        host 192.0.2.20 {
            any notice;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "WAN uplink";
        unit 0 {
            family inet {
                address 192.0.2.5/30;
            }
            family inet6 {
                address 2001:db8:2::1/64;
            }
        }
    }
    ge-0/0/1 {
        description "Datacenter trunk";
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                native-vlan-id 99;
                vlan {
                    members [ USERS SERVERS NATIVE ];
                }
            }
        }
    }
}
vlans {
    USERS {
        vlan-id 10;
    }
    SERVERS {
        vlan-id 20;
    }
    NATIVE {
        vlan-id 99;
    }
}
snmp {
    v3 {
    }
}
