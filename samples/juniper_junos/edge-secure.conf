system {
    host-name juniper-edge-01;
    services {
        ssh;
    }
    authentication-order [ radius password ];
    ntp {
        server 192.0.2.10;
    }
    syslog {
        host 192.0.2.20 {
            any notice;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "WAN uplink";
        unit 0 {
            family inet {
                address 192.0.2.5/30;
            }
            family inet6 {
                address 2001:db8:2::1/64;
            }
        }
    }
}
snmp {
    v3 {
    }
}
