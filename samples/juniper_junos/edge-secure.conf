system {
    host-name juniper-edge-01;
    services {
        ssh;
    }
    authentication-order [ radius password ];
    ntp {
        server 192.0.2.10;
    }
    syslog {
        host 192.0.2.20 {
            any notice;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "WAN uplink";
        unit 0 {
            family inet {
                address 192.0.2.5/30;
            }
            family inet6 {
                address 2001:db8:2::1/64;
            }
        }
    }
    ge-0/0/1 {
        description "Datacenter trunk";
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                native-vlan-id 99;
                vlan {
                    members [ USERS SERVERS NATIVE ];
                }
            }
        }
    }
}
vlans {
    USERS {
        vlan-id 10;
    }
    SERVERS {
        vlan-id 20;
    }
    NATIVE {
        vlan-id 99;
    }
}
snmp {
    v3 {
    }
}
firewall {
    family inet {
        filter MGMT-IN {
            term ALLOW-SSH {
                from {
                    source-address 192.0.2.0/24;
                    protocol tcp;
                    destination-port ssh;
                }
                then accept;
            }
            term DENY-REST {
                then discard;
            }
        }
    }
}
policy-options {
    prefix-list TRUSTED {
        192.0.2.0/24;
        198.51.100.0/24;
    }
}
routing-options {
    static {
        route 0.0.0.0/0 {
            next-hop 192.0.2.6;
            preference 10;
        }
        route 198.51.100.0/24 discard;
        route 2001:db8:ffff::/48 next-hop 2001:db8:2::2;
    }
    autonomous-system 65001;
    router-id 192.0.2.5;
}
protocols {
    bgp {
        group TRANSIT-V4 {
            type external;
            peer-as 65002;
            local-address 192.0.2.5;
            neighbor 192.0.2.6 {
                description "Transit IPv4";
            }
        }
        group TRANSIT-V6 {
            type external;
            peer-as 65002;
            local-address 2001:db8:2::1;
            neighbor 2001:db8:2::2 {
                description "Transit IPv6";
                shutdown;
            }
        }
    }
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                metric 10;
            }
        }
        area 0.0.0.10 {
            interface lo0.0 {
                passive;
                metric 20;
            }
        }
    }
}
