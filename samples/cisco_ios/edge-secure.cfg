version 17.9
hostname cisco-edge-01
aaa new-model
ip ssh version 2
snmp-server group NMS v3 priv
ntp server 192.0.2.10
logging host 192.0.2.20
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
vlan 99
 name NATIVE
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 192.0.2.1 255.255.255.252
 ipv6 address 2001:db8:1::1/64
 no shutdown
!
interface GigabitEthernet0/1
 description Datacenter trunk
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
line vty 0 4
 transport input ssh
ip access-list extended MGMT-IN
 10 permit tcp 192.0.2.0 0.0.0.255 host 192.0.2.1 eq ssh log
 20 deny ip any any log
!
ip prefix-list TRUSTED seq 10 permit 192.0.2.0/24 le 32
ipv6 prefix-list V6-TRUSTED seq 10 permit 2001:db8:100::/48 le 64
ip route 0.0.0.0 0.0.0.0 192.0.2.2 10
ip route 198.51.100.0 255.255.255.0 Null0 250
ipv6 route 2001:db8:ffff::/48 2001:db8:1::2
router bgp 65001
 bgp router-id 192.0.2.1
 neighbor 192.0.2.2 remote-as 65002
 neighbor 192.0.2.2 description Transit A
 neighbor 192.0.2.2 update-source Loopback0
 neighbor 2001:db8:1::2 remote-as 65002
 neighbor 2001:db8:1::2 shutdown
!
end
