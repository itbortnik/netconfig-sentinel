version 15.2
hostname cisco-access-01
no aaa new-model
snmp-server community REDACTED RO
vlan 10
 name USERS
!
interface GigabitEthernet0/1
 description User access
 no ip address
 switchport mode access
 switchport access vlan 10
 shutdown
!
line vty 0 4
 transport input telnet
clock timezone UTC 0 0
ip access-list standard VTY-SOURCES
 10 permit host 192.0.2.10
 20 deny any log
!
ip prefix-list LEGACY permit 198.51.100.0/24
end
