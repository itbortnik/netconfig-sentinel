[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netconfig-sentinel"
version = "0.1.0"
description = "Auditable multi-vendor network configuration analysis"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2.0",
  "cryptography>=46,<47",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "scikit-learn>=1.8,<2.0",
  "sqlalchemy>=2.0,<2.1",
  "tokenizers==0.23.2",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
training = ["torch==2.14.0"]
verification = ["pybatfish==0.36.0"]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "ml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "ml"]
mypy_path = ["backend", "."]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
