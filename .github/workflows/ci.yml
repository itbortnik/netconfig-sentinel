name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==5.19.0 safetensors==0.8.0
      - run: ruff check .
      - run: mypy backend/app ml
      - run: pytest --cov=app --cov=ml --cov-report=term-missing

  batfish-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      batfish:
        # Official 2026.08.27.3685 release, never the moving latest/test tag.
        image: batfish/batfish@sha256:7909378197c5a3974f2e8180af58cef0ca17b74d1cd9ba39f2d1fddb64737e55
        ports:
          - 127.0.0.1:9996:9996
        options: --memory=4g --cpus=2
    env:
      # Only explicit authored fixtures/recorded own candidate edits upload here.
      NETCONFIG_LIVE_BATFISH: "1"
      NO_PROXY: "*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,verification]"
      - name: Wait for the owned loopback engine
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(60):
              try:
                  with opener.open("http://127.0.0.1:9996/v2/version", timeout=2) as response:
                      versions = json.loads(response.read(4097))
                  assert versions["Batfish"] == "2026.08.27.3685", versions
                  print(json.dumps(versions, sort_keys=True))
                  break
              except (OSError, ValueError):
                  time.sleep(1)
          else:
              raise SystemExit("Owned loopback Batfish did not become ready")
          PY
      - name: Check real owned reachability and cleanup
        run: >-
          pytest backend/tests/integration/test_live_batfish.py
          backend/tests/integration/test_batfish_sdk_transport.py
          backend/tests/integration/test_live_model_patch_batfish.py -q -s
          --junitxml=owned-batfish-junit.xml
      - name: Check saved HTTP candidate with the real owned engine
        run: >-
          pytest backend/tests/integration/test_saved_model_patch_api.py
          -k saved_http_candidate -q -s --junitxml=owned-saved-candidate-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-batfish-results
          path: |
            owned-batfish-junit.xml
            owned-saved-candidate-junit.xml
          if-no-files-found: error
          retention-days: 14

  postgres-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NETCONFIG_TEST_DATABASE_URL: postgresql+psycopg://sentinel:integration-only-password@127.0.0.1:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest -q backend/tests/integration/test_postgres_api.py
          backend/tests/integration/test_local_model_api.py backend/tests/integration/test_role_access.py
          backend/tests/integration/test_operation_audit.py backend/tests/integration/test_saved_model_patch_api.py
          -k "not actual_isolated_native"

  frontend:
    runs-on: ubuntu-latest
    env:
      NETCONFIG_API_TOKEN: browser-tests-service-token-32-characters-001
      NETCONFIG_READER_TOKEN: browser-tests-reader-service-token-000001
      NETCONFIG_ANALYST_TOKEN: browser-tests-analyst-service-token-000001
      NETCONFIG_ENGINEER_TOKEN: browser-tests-engineer-service-token-000001
      NETCONFIG_POSTGRES_PASSWORD: 1234567890abcdef1234567890abcdef
      # Synthetic CI-only key, never a deployment credential.
      NETCONFIG_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - name: Validate synthetic API credentials
        run: >-
          python -c "import os; from app.core.settings import ApiSettings;
          ApiSettings('postgresql+psycopg://sentinel@database:5432/sentinel',
          os.environ['NETCONFIG_API_TOKEN'], os.environ['NETCONFIG_ENCRYPTION_KEY'])"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check owned synthetic model-candidate browser workflow
        run: npm run test:e2e:model-patches
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-model-candidate-browser-results
          path: artifacts/browser-model-patches-junit.xml
          retention-days: 14
      - run: docker compose up --build -d
        working-directory: .
      - run: >-
          curl --fail --connect-timeout 2 --max-time 5
          --retry 60 --retry-delay 2 --retry-all-errors --retry-max-time 120
          http://127.0.0.1:8000/ready
      - run: npm run test:e2e
        env:
          NETCONFIG_E2E_BASE_URL: http://127.0.0.1:8000
      - if: failure()
        run: docker compose logs --no-color
        working-directory: .
      - if: always()
        run: docker compose down --remove-orphans
        working-directory: .
