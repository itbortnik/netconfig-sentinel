name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: mypy backend/app ml
      - run: pytest --cov=app --cov=ml --cov-report=term-missing

  postgres-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NETCONFIG_TEST_DATABASE_URL: postgresql+psycopg://sentinel:integration-only-password@127.0.0.1:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q backend/tests/integration/test_postgres_api.py backend/tests/integration/test_local_model_api.py

  frontend:
    runs-on: ubuntu-latest
    env:
      NETCONFIG_API_TOKEN: browser-tests-service-token-32-characters-001
      NETCONFIG_POSTGRES_PASSWORD: 1234567890abcdef1234567890abcdef
      # Synthetic CI-only key, never a deployment credential.
      NETCONFIG_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - name: Validate synthetic API credentials
        run: >-
          python -c "import os; from app.core.settings import ApiSettings;
          ApiSettings('postgresql+psycopg://sentinel@database:5432/sentinel',
          os.environ['NETCONFIG_API_TOKEN'], os.environ['NETCONFIG_ENCRYPTION_KEY'])"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose up --build -d
        working-directory: .
      - run: >-
          curl --fail --connect-timeout 2 --max-time 5
          --retry 60 --retry-delay 2 --retry-all-errors --retry-max-time 120
          http://127.0.0.1:8000/ready
      - run: npm run test:e2e
        env:
          NETCONFIG_E2E_BASE_URL: http://127.0.0.1:8000
      - if: failure()
        run: docker compose logs --no-color
        working-directory: .
      - if: always()
        run: docker compose down --remove-orphans
        working-directory: .
